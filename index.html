<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>余胜民 - 全栈软件服务交付工程师</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .header .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .pdf-container {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 24px;
        }

        .pdf-wrapper {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .pdf-viewer {
            width: 100%;
            height: calc(100vh - 140px);
            border: none;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .loading p {
            margin-top: 16px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
                flex-direction: column;
                gap: 12px;
            }

            .header h1 {
                font-size: 16px;
            }

            .pdf-container {
                padding: 16px;
                margin: 0;
            }

            .pdf-viewer {
                height: calc(100vh - 160px);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>余胜民 | 全栈软件服务交付工程师</h1>
        <div class="actions">
            <a href="resume.pdf" class="btn btn-secondary" download>下载 PDF</a>
            <a href="resume.pdf" class="btn btn-primary" target="_blank">全屏查看</a>
        </div>
    </div>

    <div class="pdf-container">
        <div class="pdf-wrapper">
            <iframe src="resume.pdf" class="pdf-viewer" title="简历 PDF"></iframe>
        </div>
    </div>

    <script>
        // 检查 PDF 是否加载成功
        document.querySelector('iframe').addEventListener('error', function() {
            this.style.display = 'none';
            document.querySelector('.pdf-wrapper').innerHTML = `
                <div class="loading">
                    <p>PDF 加载失败，请 <a href="resume.pdf" target="_blank">点击这里</a> 直接查看</p>
                </div>
            `;
        });
    </script>
</body>
</html>
