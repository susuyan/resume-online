name: Build & Deploy Resume

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装依赖
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex fonts-noto-cjk

      # 构建高质量 PDF
      - name: Build PDF
        run: |
          pandoc resume.md \
            --pdf-engine=xelatex \
            --include-in-header=style.tex \
            -V mainfont="Noto Sans CJK SC" \
            -V fontsize=10pt \
            -V papersize=a4 \
            -o resume.pdf

      # 构建 HTML (使用 Pandoc 默认模板 + 自定义 CSS)
      - name: Build HTML
        run: |
          pandoc resume.md \
            --standalone \
            --css=style.css \
            -o index.html

      # 准备部署
      - name: Prepare site
        run: |
          mkdir site
          mv index.html site/
          mv resume.pdf site/
          [ -f CNAME ] && mv CNAME site/ || true
          [ -f style.css ] && mv style.css site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
