name: Build & Deploy Resume

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chinese fonts
        timeout-minutes: 2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei 2>&1 | tail -5
          sudo fc-cache -f
          echo "字体安装完成"

      - name: Install TeX Live
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-fonts-recommended \
            texlive-latex-extra
          echo "TeX Live 安装完成"

      - name: Generate resume.tex from Markdown
        run: node build/build-tex.js

      - name: Compile PDF with XeLaTeX
        run: |
          mkdir -p .latex-out
          xelatex -interaction=nonstopmode -output-directory=.latex-out resume.tex
          xelatex -interaction=nonstopmode -output-directory=.latex-out resume.tex
          cp .latex-out/resume.pdf resume.pdf

      - name: Convert PDF to HTML
        timeout-minutes: 3
        run: |
          cat > Dockerfile.pdf2html << 'EOF'
          FROM pdf2htmlex/pdf2htmlex:0.18.8.rc2-master-20200820-ubuntu-20.04-x86_64
          RUN apt-get update -qq && \
              apt-get install -y --no-install-recommends fonts-wqy-microhei && \
              apt-get clean && \
              rm -rf /var/lib/apt/lists/*
          EOF

          docker build -t pdf2htmlex-with-cjk -f Dockerfile.pdf2html .

          docker run --rm \
            -v "$PWD":/pdf \
            -w /pdf \
            pdf2htmlex-with-cjk \
            --zoom 1.5 \
            --process-outline 0 \
            --embed-font 1 \
            --font-size-multiplier 1 \
            --correct-text-visibility 1 \
            resume.pdf

          mv resume.html index.html

      - name: Prepare site
        run: |
          mkdir site
          mv index.html site/
          mv resume.pdf site/
          [ -f CNAME ] && mv CNAME site/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
