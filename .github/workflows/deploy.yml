name: Build & Deploy Resume

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: build/package-lock.json

      # 3️⃣ 安装中文字体（用于 PDF 生成）
      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei
          sudo fc-cache -fv

      # 2️⃣ 安装依赖
      - name: Install dependencies
        run: |
          cd build
          npm ci

      # 3️⃣ 安装 Puppeteer（需要 Chrome）
      - name: Install Puppeteer browsers
        run: |
          cd build
          npx puppeteer browsers install chrome
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false

      # 4️⃣ Vite 打包 React 组件
      - name: Build React app
        run: |
          cd build
          npm run build:vite

      # 5️⃣ Puppeteer 生成 PDF
      - name: Generate PDF
        run: |
          cd build
          node build-pdf.js

      # 6️⃣ 创建 PDF 查看页面（替代 pdf2htmlEX 转换）
      - name: Create PDF viewer page
        run: |
          # 创建简单的 HTML 页面，使用 PDF.js 嵌入显示 PDF
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>余胜民 - 简历</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: #f5f5f5;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 20px;
              }
              .container {
                max-width: 800px;
                width: 100%;
                text-align: center;
              }
              h1 {
                color: #1A365D;
                margin-bottom: 10px;
                font-size: 24px;
              }
              .download-btn {
                display: inline-block;
                margin: 20px 0;
                padding: 12px 30px;
                background: #1A365D;
                color: white;
                text-decoration: none;
                border-radius: 5px;
                font-weight: 500;
                transition: background 0.3s;
              }
              .download-btn:hover {
                background: #2C5282;
              }
              .pdf-viewer {
                width: 100%;
                height: 800px;
                border: none;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                background: white;
              }
              .fallback {
                margin-top: 20px;
                padding: 20px;
                background: #EDF2F7;
                border-radius: 5px;
                color: #2D3748;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>余胜民 - 全栈软件交付工程师</h1>
              <a href="resume.pdf" class="download-btn" download>下载 PDF 简历</a>
              <object class="pdf-viewer" data="resume.pdf" type="application/pdf">
                <div class="fallback">
                  <p>您的浏览器不支持 PDF 预览。</p>
                  <p>请<a href="resume.pdf">点击这里下载 PDF 文件</a>。</p>
                </div>
              </object>
            </div>
          </body>
          </html>
          EOF

      # 7️⃣ 准备 Pages 产物
      - name: Prepare site
        run: |
          mkdir site
          mv index.html site/
          mv resume.pdf site/
          [ -f CNAME ] && mv CNAME site/ || true

      # 8️⃣ 上传
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4