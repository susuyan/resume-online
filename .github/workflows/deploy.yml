name: Build & Deploy Resume

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache downloaded apt .deb files — skips re-downloading TeX packages
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-texlive-${{ runner.os }}-v1
          restore-keys: apt-texlive-${{ runner.os }}-

      - name: Install fonts & TeX Live
        timeout-minutes: 7
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-wqy-microhei \
            texlive-xetex \
            texlive-lang-chinese \
            texlive-fonts-recommended \
            texlive-latex-extra
          sudo fc-cache -f

      # Enable Docker BuildKit with GHA layer cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pdf2htmlEX image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pdf2html
          load: true
          tags: pdf2htmlex-cjk:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate resume.tex
        run: node build/build-tex.js

      # Single pass is enough for a one-page resume with no TOC or cross-refs
      - name: Compile PDF
        run: |
          mkdir -p .latex-out
          xelatex -interaction=nonstopmode -output-directory=.latex-out resume.tex
          cp .latex-out/resume.pdf resume.pdf

      - name: Convert PDF → HTML
        timeout-minutes: 3
        run: |
          docker run --rm \
            -v "$PWD":/pdf -w /pdf \
            pdf2htmlex-cjk \
            --zoom 1.5 \
            --process-outline 0 \
            --embed-font 1 \
            --font-size-multiplier 1 \
            --correct-text-visibility 1 \
            resume.pdf
          mv resume.html index.html

      - name: Prepare site
        run: |
          mkdir site
          mv index.html resume.pdf site/
          [ -f CNAME ] && cp CNAME site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
