name: Build & Deploy Resume

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1️⃣ LaTeX → PDF
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra fonts-noto-cjk

      - name: Build PDF
        run: xelatex -interaction=nonstopmode resume.tex

      # 2️⃣ 准备站点文件
      - name: Prepare site
        run: |
          mkdir site
          cp index.html site/
          cp resume.pdf site/
          [ -f CNAME ] && cp CNAME site/ || true

      # 4️⃣ 上传
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
