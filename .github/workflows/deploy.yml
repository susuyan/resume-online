name: Build & Deploy Resume

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1️⃣ 缓存 apt 依赖
      - name: Cache apt packages
        uses: actions/cache@v4
        id: apt-cache
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-pandoc-texlive-${{ hashFiles('.github/workflows/deploy.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-pandoc-texlive-

      # 2️⃣ 安装依赖（带缓存）
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex fonts-noto-cjk

      # 3️⃣ 缓存 TexLive 字体和包
      - name: Cache TexLive
        uses: actions/cache@v4
        with:
          path: |
            ~/.texlive
            /usr/share/texlive
            /usr/share/texmf
          key: ${{ runner.os }}-texlive-${{ hashFiles('style.tex') }}
          restore-keys: |
            ${{ runner.os }}-texlive-

      # 4️⃣ Markdown → PDF（带缓存检查）
      - name: Build PDF
        run: |
          pandoc resume.md \
            --pdf-engine=xelatex \
            --include-in-header=style.tex \
            -V mainfont="Noto Sans CJK SC" \
            -V fontsize=11pt \
            -V papersize=a4 \
            -o resume.pdf

      # 5️⃣ 缓存 Docker 镜像
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-pdf2htmlex
          restore-keys: |
            ${{ runner.os }}-docker-

      # 6️⃣ PDF → HTML（使用本地缓存镜像）
      - name: Convert PDF to HTML
        run: |
          # 尝试加载缓存的镜像
          if [ -f /tmp/.buildx-cache/pdf2htmlex.tar ]; then
            docker load -i /tmp/.buildx-cache/pdf2htmlex.tar || true
          fi

          docker run --rm \
            -v "$PWD":/pdf \
            -w /pdf \
            pdf2htmlex/pdf2htmlex:0.18.8.rc2-master-20200820-ubuntu-20.04-x86_64 \
            --zoom 1.3 \
            --process-outline 0 \
            resume.pdf

          # 保存镜像到缓存
          mkdir -p /tmp/.buildx-cache
          docker save pdf2htmlex/pdf2htmlex:0.18.8.rc2-master-20200820-ubuntu-20.04-x86_64 -o /tmp/.buildx-cache/pdf2htmlex.tar || true

          mv resume.html index.html

      # 7️⃣ 准备 Pages 产物
      - name: Prepare site
        run: |
          mkdir site
          mv index.html site/
          mv resume.pdf site/
          [ -f CNAME ] && mv CNAME site/ || true
          [ -f resume.css ] && mv resume.css site/ || true
          [ -d resume_fonts ] && mv resume_fonts site/ || true

      # 8️⃣ 上传到 GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
