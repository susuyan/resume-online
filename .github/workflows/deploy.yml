name: Build & Deploy Resume

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: build/package-lock.json

      # 3️⃣ 安装中文字体（用于 PDF 生成）
      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei
          sudo fc-cache -fv

      # 2️⃣ 安装依赖
      - name: Install dependencies
        run: |
          cd build
          npm ci

      # 3️⃣ 安装 Puppeteer（需要 Chrome）
      - name: Install Puppeteer browsers
        run: |
          cd build
          npx puppeteer browsers install chrome
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false

      # 4️⃣ Vite 打包 React 组件
      - name: Build React app
        run: |
          cd build
          npm run build:vite

      # 5️⃣ Puppeteer 生成 PDF
      - name: Generate PDF
        run: |
          cd build
          node build-pdf.js

      # 6️⃣ PDF → HTML（使用 pdf2htmlEX）
      - name: Convert PDF to HTML
        run: |
          # 创建自定义 Dockerfile 安装中文字体
          cat > Dockerfile.pdf2html << 'EOF'
          FROM pdf2htmlex/pdf2htmlex:0.18.8.rc2-master-20200820-ubuntu-20.04-x86_64
          RUN apt-get update && apt-get install -y fonts-noto-cjk fonts-wqy-zenhei && apt-get clean
          EOF

          # 构建自定义镜像
          docker build -t pdf2htmlex-with-cjk -f Dockerfile.pdf2html .

          # 使用优化的参数转换 PDF
          # 关键参数说明：
          # --zoom 1.5: 缩放比例
          # --process-outline 0: 不生成大纲
          # --embed-font 1: 嵌入字体到 HTML
          # --font-size-multiplier 1: 避免字体大小舍入误差
          # --correct-text-visibility 1: 修复文本可见性，防止重影
          docker run --rm \
            -v "$PWD":/pdf \
            -w /pdf \
            pdf2htmlex-with-cjk \
            --zoom 1.5 \
            --process-outline 0 \
            --embed-font 1 \
            --font-size-multiplier 1 \
            --correct-text-visibility 1 \
            resume.pdf

          mv resume.html index.html

      # 7️⃣ 准备 Pages 产物
      - name: Prepare site
        run: |
          mkdir site
          mv index.html site/
          mv resume.pdf site/
          [ -f CNAME ] && mv CNAME site/ || true

      # 8️⃣ 上传
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4