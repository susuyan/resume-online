name: Build & Deploy Resume

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 设置 Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 安装中文字体（轻量级，带超时）
      - name: Install Chinese fonts
        timeout-minutes: 2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei 2>&1 | tail -5
          sudo fc-cache -f
          echo "字体安装完成"

      # 缓存并安装依赖
      - name: Install dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('build/bun.lock', 'build/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: |
          cd build
          bun install --frozen-lockfile

      # 安装 Puppeteer（带缓存）
      - name: Install Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('build/package.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-
      - run: |
          cd build
          bunx puppeteer browsers install chrome
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false

      # Vite 打包 React 组件
      - name: Build React app
        run: |
          cd build
          bun run build:vite

      # Puppeteer 生成 PDF
      - name: Generate PDF
        run: |
          cd build
          bun run build-pdf.js

      # PDF → HTML（使用 pdf2htmlEX）
      - name: Convert PDF to HTML
        timeout-minutes: 3
        run: |
          cat > Dockerfile.pdf2html << 'EOF'
          FROM pdf2htmlex/pdf2htmlex:0.18.8.rc2-master-20200820-ubuntu-20.04-x86_64
          RUN apt-get update -qq && \
              apt-get install -y --no-install-recommends fonts-wqy-microhei && \
              apt-get clean && \
              rm -rf /var/lib/apt/lists/*
          EOF

          docker build -t pdf2htmlex-with-cjk -f Dockerfile.pdf2html .

          docker run --rm \
            -v "$PWD":/pdf \
            -w /pdf \
            pdf2htmlex-with-cjk \
            --zoom 1.5 \
            --process-outline 0 \
            --embed-font 1 \
            --font-size-multiplier 1 \
            --correct-text-visibility 1 \
            resume.pdf

          mv resume.html index.html

      # 准备 Pages 产物
      - name: Prepare site
        run: |
          mkdir site
          mv index.html site/
          mv resume.pdf site/
          [ -f CNAME ] && mv CNAME site/ || true

      # 上传
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4