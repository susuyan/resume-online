name: Build & Deploy Resume

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1️⃣ Markdown → PDF
      - name: Install pandoc
        run: sudo apt-get install -y pandoc texlive-xetex fonts-noto-cjk

      - name: Build PDF
        run: |
          pandoc resume.md \
            --pdf-engine=xelatex \
            -V mainfont="Noto Sans CJK SC" \
            -o resume.pdf

      # 2️⃣ PDF → HTML（pdf2htmlEX via Docker）
      - name: Convert PDF to HTML
        run: |
          docker run --rm \
            -v "$PWD":/pdf \
            pdf2htmlex/pdf2htmlex:0.18.8.rc2-master-20200820-ubuntu-20.04-x86_64 \
            pdf2htmlEX resume.pdf

          mv resume.html index.html

      # 3️⃣ 准备 Pages 产物
      - name: Prepare site
        run: |
          mkdir site
          mv index.html site/
          # 将 PDF 也放入 site 目录，方便下载
          mv resume.pdf site/
          [ -f resume.css ] && mv resume.css site/ || true
          [ -d resume_fonts ] && mv resume_fonts site/ || true

      # 4️⃣ 上传到 GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
